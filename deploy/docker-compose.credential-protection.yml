# Apply explicitly alongside the base Compose file, after offline migration.
# The host file must be private, outside this repository, and readable by UID 1000.
services:
  sub2api:
    environment:
      ACCOUNT_CREDENTIAL_KEYRING_FILE: /run/secrets/upstream-credential-keyring
      ACCOUNT_CREDENTIAL_ENCRYPTION_REQUIRED: "true"
      ACCOUNT_CREDENTIAL_ALLOW_LEGACY: "false"
    secrets:
      - source: upstream-credential-keyring
        target: upstream-credential-keyring
        uid: "1000"
        gid: "1000"
        mode: 0400

secrets:
  upstream-credential-keyring:
    file: ${ACCOUNT_CREDENTIAL_KEYRING_HOST_FILE:?Set a protected external keyring path}
